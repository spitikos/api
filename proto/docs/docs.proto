syntax = "proto3";

package docs;

option go_package = "github.com/spitikos/spitikos/api/proto/docs;docsv1";

// DocsService manages the documentation lifecycle.
service DocsService {
  // SyncDocuments is triggered by a webhook. It receives a complete list of all
  // current document slugs, fetches their content, and updates the cache.
  rpc SyncDocuments(SyncDocumentsRequest) returns (SyncDocumentsResponse) {}

  // GetDocumentSlugs retrieves a list of all available document slugs from the cache.
  rpc GetDocumentSlugs(GetDocumentSlugsRequest) returns (GetDocumentSlugsResponse) {}
}

// SyncDocumentsRequest contains the complete list of all current document slugs.
message SyncDocumentsRequest {
  // The complete list of slugs (e.g., "architecture-overview", "pi-setup").
  repeated string slugs = 1;
}

// SyncDocumentsResponse is a simple response to acknowledge the sync.
message SyncDocumentsResponse {
  // Indicates whether the sync request was successfully received.
  bool success = 1;
  // A descriptive message about the result of the operation.
  string message = 2;
}

// GetDocumentSlugsRequest is the request message for the GetDocumentSlugs RPC.
message GetDocumentSlugsRequest {}

// GetDocumentSlugsResponse contains the list of all document slugs.
message GetDocumentSlugsResponse {
  // The list of all slugs currently available in the cache.
  repeated string slugs = 1;
}
