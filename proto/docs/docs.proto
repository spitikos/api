syntax = "proto3";

package docs;

option go_package = "github.com/spitikos/spitikos/api/proto/docs;docsv1";

import "google/protobuf/timestamp.proto";

service DocsService {
  rpc Sync(SyncRequest) returns (SyncResponse) {}
  rpc GetSlugs(GetSlugsRequest) returns (GetSlugsResponse) {}
  rpc GetDoc(GetDocRequest) returns (GetDocResponse) {}
}

message SyncRequest {
  repeated string paths = 1;
}

message SyncResponse {
  map<string, SyncStatus> status = 1;
}

message GetSlugsRequest {}

message GetSlugsResponse {
  repeated string slugs = 1;
}

message GetDocRequest {
  string slug = 1;
}

message GetDocResponse {
  Doc doc = 1;
}

message SyncStatus {
  bool GetContent = 1;
  bool GetLatestCommit = 2;
  bool MarshalDoc = 3;
  bool CacheDoc = 4;
}

message Doc {
  string title = 1;
  google.protobuf.Timestamp modified = 2;
  string content = 3;
}